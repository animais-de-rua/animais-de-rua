services:
  app:
    build: .
    ports:
      - "8080:80"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: animaisderua
      DB_USERNAME: animaisderua
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: animaisderua
      MYSQL_USER: animaisderua
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
